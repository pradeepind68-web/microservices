spring.application.name=api-gateway
server.port=8765
spring.cloud.gateway.metrics.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# User Service Route
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user-api/**

# Product Service Route
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product-api/**
# Order Service Route
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/order-service/**
# Card Service Route
spring.cloud.gateway.server.webflux.routes[3].id=card-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CARD-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/card-api/**
# Payment Service Route
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payment-api/**
# Auth Service Route
spring.cloud.gateway.server.webflux.routes[5].id=auth-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/auth-api/**

management.endpoints.web.exposure.include=*
logging.level.org.springframework.security=TRACE

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

logging.level.reactor.netty=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=TRACE
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=TRACE
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.boot.context.config=DEBUG

